[project]
name = "geek-select-backend"
version = "0.1.0"
description = "FastAPI backend for the Geek Select AI commerce assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "alembic>=1.13,<2",
  "argon2-cffi>=23,<26",
  "fastapi",
  "fastembed>=0.7,<1",
  "langchain",
  "langchain-openai",
  "langgraph",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "mcp>=1.28,<2",
  "pydantic-settings",
  "pyjwt>=2.10,<3",
  "pymilvus>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
